# Canonical main-evaluation configuration. One supported setup; anything else is a
# side experiment and does not produce comparable numbers.
#
# ONE JOB PER DATASET -- tasks are named for the instance alone, so two datasets
# pooled into one job would collide. This file pins everything except which
# dataset; `-p` supplies that and replaces `datasets:` outright, which is what
# keeps every other value identical across the set.
#
#   uv run harbor run -c configs/main-eval.yaml \
#     -p datasets/flbench-repair-eval500-gold --job-name repair-gold
#
#   uv run harbor run -c configs/main-eval.yaml \
#     -p datasets/flbench-repair-eval500-diagnosis-<model-id> \
#     --job-name repair-diagnosis-<model-id>
#
# A CLI flag overrides this file, so `--print-config` is the check that a batch is
# the canonical one. Prerequisites and the per-dataset gate: see README, "Locking
# the task set".

job_name: faultloc-main
jobs_dir: jobs

# 500 instances x 3 = 1500 trials per dataset. The agent still gets ONE attempt
# per trial; repetition is how fix probability is measured, rather than letting it
# iterate against the oracle.
n_attempts: 3

# The box is dedicated. Raise only with storage headroom to match: each concurrent
# trial holds an ARVO image plus a synced build tree.
#
# The binding constraint is the VERIFIER, not the agent. Agent phases are
# API-bound and oversubscribe harmlessly, but each verifier runs `arvo compile`,
# and concurrent builds contend for real cores -- at 16 on the 32-core box, load
# reached 50-64 and one build (wget2) ran past 25 minutes against a 1800s ceiling.
# A build that times out under contention is recorded as `compiled: 0`, which is
# indistinguishable in the reward file from a patch that genuinely does not
# build: silent, and biased toward slow-building projects.
#
# 12 is the operating point -- measured safe at 8, measured harmful at 16, and
# untested in between. If a batch shows `compiled` dropping on the slow projects
# relative to a run at 8, contention is the first thing to suspect.
n_concurrent_trials: 12

# ---------------------------------------------------------------- agent + model
# `qwen-coder` is Harbor's name for the Qwen Code CLI; `qwen-code` is not a valid
# value. It reads OPENAI_API_KEY and OPENAI_BASE_URL, so `set -a && . .env && set
# +a` before running is what points it at the gateway.
#
# `qwen3-small` is a gateway alias serving Qwen/Qwen3.6-27B. It is absent from the
# /models listing, so assert it from a completion response's `model` field rather
# than trusting this comment.
#
# `kwargs.version` is load-bearing, not hygiene: the CLI is not baked into
# agent-image/, Harbor installs it fresh in every trial, and without a pin that is
# `@latest` from a package publishing roughly daily. A batch straddling a publish
# would run two different agents with nothing in the reward files to show it.
# Bumping it is a new experiment, not an upgrade -- results do not pool across
# agent versions. Check `agent_info.version` in a trajectory to confirm it took.
agents:
  - name: qwen-coder
    model_name: qwen3-small
    kwargs:
      version: "0.21.1"

# ------------------------------------------------------------ time + resources
# Budgets live in each task.toml (agent 1800s, verifier 2400s, 4 CPU, 8 GB) and are
# identical across datasets by construction -- repair_boundaries.py asserts
# task.toml differs only in what identifies the condition. Multipliers are pinned
# at 1.0 so a stray flag cannot rescale one batch relative to another.
timeout_multiplier: 1.0
agent_timeout_multiplier: 1.0
verifier_timeout_multiplier: 1.0
agent_setup_timeout_multiplier: 1.0
environment_build_timeout_multiplier: 1.0

environment:
  # Harbor's default teardown removes the archival ARVO base, forcing a ~3 GB
  # re-pull per trial. Load-bearing. The diagnosis runs, which do not read this
  # file, pass `--no-delete` for the same reason.
  delete: false

  # Raises gost's ~15s relay timeout inside Harbor's egress sidecar. Without it
  # every repair trial errors: the verifier POSTs /compile, `arvo compile` runs
  # for minutes, and gost hangs up long before it answers -- measured as
  # `InfrastructureError: POST /compile: Remote end closed connection without
  # response` on 5/5 of the first real agent run. Harbor exposes no setting for
  # this, so the fix is a replacement gost.yaml mounted over the sidecar's; see
  # harbor-overrides/.
  #
  # Path is relative to the working directory, so `harbor run` must be invoked
  # from the repo root -- Harbor does NOT expand ${VAR} in this file, it passes
  # the string through as a path. The absolute path needed for the bind mount
  # lives inside the compose file as ${FAULTLOC_ROOT}, which COMPOSE does expand,
  # so that variable must be exported (README, step 1).
  # scripts/check_egress_override.py guards both the variable and upstream drift.
  extra_docker_compose:
    - harbor-overrides/egress-timeout.compose.yaml

# --------------------------------------------------------------------- retries
# Only infrastructure is retried. An agent that burns its budget, exits non-zero,
# overflows its context or refuses has PRODUCED A RESULT. Retrying those would
# resample the agent until it succeeded and inflate every rate in the report.
#
# Verifier-side infrastructure failures are handled in-container instead:
# repair_score.py raises InfrastructureError for an unreachable sidecar or a failed
# source sync, writes no reward file, and Harbor errors the trial rather than
# recording a zero the agent did not earn.
retry:
  max_retries: 3
  min_wait_sec: 5
  max_wait_sec: 120
  include_exceptions:
    - ApiConnectionError
    - ApiConnectionClosedError
    - ApiInternalServerError
    - ApiOverloadedError
    - ApiRateLimitError
    - ApiResponseStalledError
    - EnvironmentStartTimeoutError
    - HealthcheckError
    - NetworkConnectionError

# ------------------------------------------------------------------- task set
# Default target; override with `-p <dataset>` per job. A dataset directory holds
# exactly one condition over the locked 500, so no task_names filter is needed.
# Expect 500 tasks minus whatever that dataset's not_run.json accounts for -- any
# other shortfall means generation dropped instances and is silent here.
datasets:
  - path: datasets/flbench-repair-eval500-gold
