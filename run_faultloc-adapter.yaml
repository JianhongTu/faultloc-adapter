jobs_dir: jobs
n_attempts: 1
timeout_multiplier: 1.0
orchestrator:
  type: local
  n_concurrent_trials: 4
  quiet: false
environment:
  type: docker
  # type: daytona
  force_build: true
  # delete: true runs `docker compose down --rmi local` on teardown, which deletes
  # every image in the stack -- including the digest-pinned ARVO base (~3GB) and the
  # agent image. Only compose tasks hit that path, so it is easy to miss. Keep false.
  delete: false
  # env:
  #   ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  #   ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
  #   DAYTONA_API_KEY: ${DAYTONA_API_KEY}
agents:
  - name: oracle
  # - name: claude-code
  #   model_name: anthropic/claude-haiku-4-5
datasets:
  - path: datasets/faultloc-adapter